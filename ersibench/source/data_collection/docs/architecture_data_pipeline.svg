<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <defs>
    <style>
      .h1 { font: 700 18px Arial, 'Segoe UI', sans-serif; fill: #111; }
      .h2 { font: 700 14px Arial, 'Segoe UI', sans-serif; fill: #111; }
      .node { font: 600 12px Arial, 'Segoe UI', sans-serif; fill: #111; }
      .small { font: 11px Arial, 'Segoe UI', sans-serif; fill: #333; }
      .label { font: 600 11px Arial, 'Segoe UI', sans-serif; fill: #0b5fff; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrB" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0b5fff"/>
    </marker>
    <marker id="arrG" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f8a4c"/>
    </marker>
  </defs>

  <rect width="1280" height="820" fill="#ffffff"/>

  <!-- Host outer -->
  <rect x="30" y="70" width="1220" height="720" rx="16" fill="#fafafa" stroke="#666" stroke-width="2"/>
  <text x="640" y="100" text-anchor="middle" class="h1">�;: / Docker</text>

  <!-- Template inputs top -->
  <rect x="80" y="20" width="160" height="40" rx="8" fill="#fff8e8" stroke="#c48a00" stroke-width="1.6"/>
  <text x="160" y="45" text-anchor="middle" class="node">tasks/*.json</text>
  <line x1="160" y1="60" x2="160" y2="230" stroke="#c48a00" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Terminal 1 Server -->
  <rect x="60" y="130" width="520" height="420" rx="12" fill="#f3fbf6" stroke="#1f8a4c" stroke-width="2.2"/>
  <text x="320" y="160" text-anchor="middle" class="h2">Terminal 1  Server</text>

  <rect x="160" y="180" width="280" height="42" rx="8" fill="#ffffff" stroke="#1f8a4c" stroke-width="1.5"/>
  <text x="300" y="206" text-anchor="middle" class="node">data_collector_server.py</text>

  <!-- DS forks to CC and GRPC -->
  <line x1="300" y1="222" x2="300" y2="250" stroke="#1f8a4c" stroke-width="1.8" marker-end="url(#arrG)"/>
  <line x1="300" y1="240" x2="170" y2="240" stroke="#1f8a4c" stroke-width="1.8"/>
  <line x1="170" y1="240" x2="170" y2="270" stroke="#1f8a4c" stroke-width="1.8" marker-end="url(#arrG)"/>
  <line x1="300" y1="240" x2="430" y2="240" stroke="#1f8a4c" stroke-width="1.8"/>
  <line x1="430" y1="240" x2="430" y2="270" stroke="#1f8a4c" stroke-width="1.8" marker-end="url(#arrG)"/>

  <rect x="60" y="270" width="220" height="42" rx="8" fill="#d9f2e4" stroke="#1f8a4c" stroke-width="1.8"/>
  <text x="170" y="296" text-anchor="middle" class="node">GrpcServer :50051</text>

  <rect x="300" y="270" width="220" height="42" rx="8" fill="#ffffff" stroke="#1f8a4c" stroke-width="1.5"/>
  <text x="410" y="296" text-anchor="middle" class="node">CommandController</text>

  <line x1="410" y1="312" x2="410" y2="350" stroke="#1f8a4c" stroke-width="1.8" marker-end="url(#arrG)"/>

  <rect x="280" y="350" width="260" height="42" rx="8" fill="#ffffff" stroke="#1f8a4c" stroke-width="1.5"/>
  <text x="410" y="376" text-anchor="middle" class="node">UIBuilder + cuRobo</text>

  <line x1="410" y1="392" x2="410" y2="430" stroke="#1f8a4c" stroke-width="1.8" marker-end="url(#arrG)"/>
  <!-- also CC to ROS - draw from CC down-left -->
  <path d="M340,291 C280,291 250,430 280,450" fill="none" stroke="#1f8a4c" stroke-width="1.8" marker-end="url(#arrG)"/>

  <rect x="100" y="450" width="360" height="50" rx="8" fill="#e8fff4" stroke="#1f8a4c" stroke-width="1.6"/>
  <text x="280" y="472" text-anchor="middle" class="node">ROS2 Bridge</text>
  <text x="280" y="490" text-anchor="middle" class="small">+ ros2 bag record</text>

  <!-- Terminal 2 Client -->
  <rect x="700" y="130" width="520" height="420" rx="12" fill="#f4f8ff" stroke="#2f6fed" stroke-width="2.2"/>
  <text x="960" y="160" text-anchor="middle" class="h2">Terminal 2  Client</text>

  <rect x="820" y="180" width="280" height="42" rx="8" fill="#ffffff" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="960" y="206" text-anchor="middle" class="node">run_data_collection.py</text>
  <line x1="960" y1="222" x2="960" y2="255" stroke="#2f6fed" stroke-width="1.8" marker-end="url(#arrB)"/>

  <rect x="820" y="255" width="280" height="42" rx="8" fill="#ffffff" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="960" y="281" text-anchor="middle" class="node">TaskGenerator</text>
  <line x1="960" y1="297" x2="960" y2="330" stroke="#2f6fed" stroke-width="1.8" marker-end="url(#arrB)"/>

  <rect x="820" y="330" width="280" height="42" rx="8" fill="#dce9ff" stroke="#2f6fed" stroke-width="1.8"/>
  <text x="960" y="356" text-anchor="middle" class="node">DataCollectionAgent</text>
  <line x1="960" y1="372" x2="960" y2="405" stroke="#2f6fed" stroke-width="1.8" marker-end="url(#arrB)"/>

  <rect x="820" y="405" width="280" height="50" rx="8" fill="#dce9ff" stroke="#2f6fed" stroke-width="1.8"/>
  <text x="960" y="427" text-anchor="middle" class="node">IsaacSimRpcRobot</text>
  <text x="960" y="445" text-anchor="middle" class="small">(+ RpcClient)</text>

  <!-- saved_task -->
  <rect x="1080" y="20" width="160" height="40" rx="8" fill="#fff8e8" stroke="#c48a00" stroke-width="1.6"/>
  <text x="1160" y="45" text-anchor="middle" class="node">saved_task/*.json</text>
  <line x1="240" y1="40" x2="1080" y2="40" stroke="#c48a00" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="640" y="32" text-anchor="middle" class="small">TaskGenerator </text>
  <line x1="1160" y1="60" x2="1160" y2="351" stroke="#c48a00" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="1160" y1="351" x2="1100" y2="351" stroke="#c48a00" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="1180" y="220" class="small">ST � AG</text>

  <!-- gRPC between RB and GRPC -->
  <path d="M820,430 C650,430 500,291 280,291" fill="none" stroke="#0b5fff" stroke-width="2.4"/>
  <polygon points="280,291 292,286 290,298" fill="#0b5fff"/>
  <polygon points="820,430 808,435 810,423" fill="#0b5fff"/>
  <rect x="500" y="340" width="120" height="36" rx="8" fill="#ffffff" stroke="#0b5fff" stroke-width="1.8"/>
  <text x="560" y="362" text-anchor="middle" class="label">gRPC</text>

  <!-- ROS -> recording_data -->
  <line x1="280" y1="500" x2="280" y2="580" stroke="#1f8a4c" stroke-width="1.8" marker-end="url(#arrG)"/>
  <ellipse cx="280" cy="620" rx="130" ry="40" fill="#eef8f1" stroke="#1f8a4c" stroke-width="1.8"/>
  <text x="280" y="616" text-anchor="middle" class="node">recording_data/</text>
  <text x="280" y="634" text-anchor="middle" class="small">*.mcap</text>
  <text x="300" y="555" class="label">mcap</text>

  <!-- AG task success -> extract -->
  <path d="M820,351 C700,351 620,580 560,600" fill="none" stroke="#8a2be2" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="700" y="500" class="label">task success</text>

  <rect x="400" y="600" width="280" height="42" rx="8" fill="#f5e8ff" stroke="#8a2be2" stroke-width="1.6"/>
  <text x="540" y="626" text-anchor="middle" class="node">extract_and_convert_data.py</text>

  <line x1="680" y1="621" x2="780" y2="621" stroke="#8a2be2" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="780" y="590" width="320" height="70" rx="8" fill="#ffffff" stroke="#8a2be2" stroke-width="1.6"/>
  <text x="940" y="620" text-anchor="middle" class="node">camera / observations /</text>
  <text x="940" y="640" text-anchor="middle" class="small">aligned_joints.h5 ...</text>
</svg>
